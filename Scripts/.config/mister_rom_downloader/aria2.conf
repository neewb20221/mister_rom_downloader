# Download-only, low footprint for MiSTer
continue=true
max-connection-per-server=1
split=1
max-concurrent-downloads=1
file-allocation=none
check-integrity=false

# No seeding / no upload
seed-ratio=0.0
seed-time=0
max-upload-limit=1K
bt-max-peers=32
bt-request-peer-speed-limit=0
bt-stop-timeout=120
bt-detach-seed-only=true

# DHT needed for magnet metadata fallback
enable-dht=true
enable-dht6=false
enable-peer-exchange=true
bt-enable-lpd=false
disable-ipv6=true
listen-port=6881-6999
dht-listen-port=6881-6999
# Bootstrap DHT (empty dht.dat is common on MiSTer)
dht-entry-point=router.bittorrent.com:6881
dht-entry-point=dht.transmissionbt.com:6881
dht-entry-point=router.utorrent.com:6881

# Console readout ? redirected to log files by TUI (needed for speed/peers/ETA)
# Short timeouts: dead trackers must fail fast (not burn 2?60s each)
console-log-level=notice
summary-interval=1
show-console-readout=true
quiet=false
timeout=15
connect-timeout=10
max-tries=2
