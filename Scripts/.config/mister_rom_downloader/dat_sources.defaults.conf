# mister_rom_downloader DAT sources
# Format (one source per block):
#
# [id]
# enabled=0|1
# name=Human label
# mode=github_prefix|url
# repo=owner/repo          # github_prefix
# branch=main              # github_prefix
# dir=DatRoot              # github_prefix
# prefix=MiSTer_Console (  # github_prefix ? pick newest/first match from API listing
# url=https://...          # url mode
# local=File.dat           # saved under dats/ with this stable name
#
# Defaults point at MiSTer Organize:
# https://github.com/MiSTerOrganize/MiSTer_Organize/tree/main/DatRoot

[mister_console]
enabled=1
name=MiSTer_Console
mode=github_prefix
repo=MiSTerOrganize/MiSTer_Organize
branch=main
dir=DatRoot
prefix=MiSTer_Console (
local=MiSTer_Console.dat

